---
apiVersion: apps/v1
kind: Deployment
metadata:
  - name: deployment1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
        - name: container1
          image: ysv26/sports-ticket-app:latest
          ports:
            - containerPort: 80
